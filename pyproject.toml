[project]
name = "steam-workshop-analyzer"
version = "0.1.0"
description = "Agent for detecting vulnerabilities in Wallpaper Engine wallpapers (Steam Workshop)"
requires-python = ">=3.12"
dependencies = [
    "puremagic>=1.28",
    "requests>=2.31",
    "mcp>=1.2",
    "anthropic[mcp]>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
swa = "swa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
